name: Security checks

on:
  pull_request:
  push:
    branches: [main, daily, mobile-app]
  schedule:
    - cron: "20 2 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python backend/scripts/check_secret_hygiene.py

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build --pull --provenance=false --tag tailorahub-backend:security ./backend
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tailorahub-backend:security
          format: table
          scanners: vuln
          # pip's bundled build-environment SBOM lists packages that are not
          # installed in the runtime; live METADATA remains fully scanned.
          skip-files: "**/pip/_vendor/bom.cdx.json"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
