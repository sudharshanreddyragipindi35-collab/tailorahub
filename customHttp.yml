applications:
  - appRoot: frontend
    customHeaders:
      - pattern: "**/*"
        headers:
          - key: Strict-Transport-Security
            value: max-age=31536000; includeSubDomains
          - key: X-Content-Type-Options
            value: nosniff
          - key: X-Frame-Options
            value: DENY
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=(self), payment=(self)
          - key: Content-Security-Policy
            value: >-
              default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://checkout.razorpay.com https://maps.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.tailorahub.com wss://api.tailorahub.com https://maps.googleapis.com https://*.razorpay.com; frame-src https://api.razorpay.com https://*.razorpay.com; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests
      - pattern: "/assets/*"
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
      - pattern: "/index.html"
        headers:
          - key: Cache-Control
            value: no-cache, no-store, must-revalidate
      - pattern: "/sw.js"
        headers:
          - key: Cache-Control
            value: no-cache, no-store, must-revalidate
